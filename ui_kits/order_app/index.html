<!-- @dsCard group="Order app" viewport="900x760" name="Table-side ordering app" subtitle="Counter/table ordering: menu, cart, kitchen confirmation" -->
<!-- @startingPoint section="App" subtitle="Mobile ordering flow, 390×780" viewport="900x760" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Hotel Mudaliyar — ordering</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.HM_ASSET_BASE='../..'</script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="MenuScreen.jsx"></script>
<script type="text/babel" src="CartScreen.jsx"></script>
<style>html,body{margin:0;background:var(--surface-sunken)}#root{min-height:100vh;display:grid;place-items:center;padding:24px}
.phone{width:390px;height:780px;background:var(--surface-page);border-radius:22px;overflow:hidden;border:1px solid var(--border-hairline);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;position:relative}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { TabBar, Dialog, Button, Notice } = window.HotelMudaliyarDesignSystem_f1309a;
function App(){
  const [menu,setMenu]=React.useState(null);
  const [tab,setTab]=React.useState('menu');
  const [cart,setCart]=React.useState({});
  const [placed,setPlaced]=React.useState(null);
  React.useEffect(()=>{fetch('../../data/menu.json').then(r=>r.json()).then(setMenu)},[]);
  const add=(it)=>setCart(c=>({...c,[it.name]:{...it,qty:(c[it.name]?.qty||0)+1}}));
  const qty=(name,v)=>setCart(c=>{const n={...c};if(v<=0)delete n[name];else n[name]={...n[name],qty:v};return n});
  const lines=Object.values(cart);
  const counts=Object.fromEntries(lines.map(l=>[l.name,l.qty]));
  const total=lines.reduce((n,l)=>n+l.qty,0);
  return (<div className="phone">
    {!menu?<div style={{padding:40,color:'var(--text-muted)'}}>Loading…</div>:
      tab==='menu'?<MenuScreen menu={menu} onAdd={add} counts={counts}/>:
      tab==='cart'?<CartScreen lines={lines} onQty={qty} onPlace={(t)=>{setPlaced(t);setTab('bill')}}/>:
      tab==='delivery'?<div style={{padding:20}}><Notice tone="info" title="Delivery">Delivery orders arrive from Swiggy and Zomato and appear on the counter screen. In-app delivery is not live yet.</Notice></div>:
      <div style={{padding:20,display:'flex',flexDirection:'column',gap:16}}>
        <Notice tone={placed?'success':'info'} title={placed?'Sent to kitchen':'No bill yet'}>{placed?'Table 7 · ₹'+placed+' · KOT #'+String(Math.floor(Math.random()*900+100)):'Place an order to open a bill.'}</Notice>
        {placed?<Button variant="outline" iconLeft="printer" onClick={()=>window.print()}>Print bill</Button>:null}
      </div>}
    <TabBar tabs={[{id:'menu',label:'Menu',icon:'utensils'},{id:'cart',label:total?'Cart · '+total:'Cart',icon:'shopping-bag'},{id:'delivery',label:'Delivery',icon:'bike'},{id:'bill',label:'Bill',icon:'receipt'}]} active={tab} onSelect={setTab}/>
    {placed&&tab==='bill'?<Dialog title="Order sent" tamilTitle="சமையலறைக்கு அனுப்பப்பட்டது" width={300} onClose={()=>setPlaced(p=>p)} footer={<Button size="sm" onClick={()=>setPlaced(null)}>Close</Button>}>Table 7 · ₹{placed}. The kitchen ticket has printed.</Dialog>:null}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
