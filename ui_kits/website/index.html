<!DOCTYPE html><html><head><meta charset="utf-8"><title>Hotel Mudaliyar — Melamadai, Madurai</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.HM_ASSET_BASE='../..'</script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Signatures.jsx"></script>
<script type="text/babel" src="MenuBoard.jsx"></script>
<script type="text/babel" src="Story.jsx"></script>
<script type="text/babel" src="Halls.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<style>html,body{margin:0}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { NavBar, Dialog, Button } = window.HotelMudaliyarDesignSystem_f1309a;
function Site(){
  const [page,setPage]=React.useState('Menu');
  const [menu,setMenu]=React.useState(null);
  const [dialog,setDialog]=React.useState(null);
  React.useEffect(()=>{fetch('../../data/menu.json').then(r=>r.json()).then(setMenu)},[]);
  const scroll=(id)=>{const el=document.getElementById(id);if(el)window.scrollTo({top:el.offsetTop-72,behavior:'smooth'})};
  const go=(p)=>{setPage(p);scroll({Menu:'menu',Story:'story',Halls:'halls',Visit:'visit'}[p])};
  return (<div style={{position:'relative'}}>
    <NavBar items={['Menu','Story','Halls','Visit']} active={page} onNavigate={go} cta="Call to reserve" onCta={()=>setDialog('reserve')}/>
    <Hero onMenu={()=>go('Menu')} onReserve={()=>setDialog('reserve')}/>
    <Signatures onOpen={(d)=>setDialog(d.name)}/>
    <div id="menu">{menu?<MenuBoard menu={menu}/>:<div style={{padding:80,textAlign:'center',color:'var(--text-muted)'}}>Loading the menu…</div>}</div>
    <div id="story"><Story/></div>
    <div id="halls"><Halls onSubmit={()=>setDialog('enquiry')}/></div>
    <div id="visit"><Footer/></div>
    {dialog?<Dialog title={dialog==='reserve'?'Reserve a table':dialog==='enquiry'?'Enquiry sent':dialog} tamilTitle={dialog==='reserve'?'மேசை பதிவு':null} onClose={()=>setDialog(null)} footer={<Button size="sm" onClick={()=>setDialog(null)}>Done</Button>} style={{position:'fixed'}}>
      {dialog==='reserve'?'Call 0452 000 0000 or ask at the counter. Tables are held for 15 minutes.':dialog==='enquiry'?'We will call you back about Ammaiyappan Hall within a day.':'Available all day at the Melamadai counter.'}
    </Dialog>:null}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
</script></body></html>
